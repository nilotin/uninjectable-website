<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Baleena — Demo</title>
    <meta name="description" content="Baleena Product Demo" />
    <meta name="theme-color" content="#050816" />
    <link rel="icon" type="image/png" href="/baleena-logo.png" />
    <link rel="shortcut icon" href="/baleena-logo.png" />
    <link rel="apple-touch-icon" href="/baleena-logo.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        min-height: 100%;
        width: 100%;
        background: #050816;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .container { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }
      .header {
        height: 48px;
        min-height: 48px;
        background: #070b1e;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
      .brand img { height: 24px; width: auto; display: block; }
      .brand-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #f8fafc; }
      .badge {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        padding: 2px 8px;
        border: 1px solid rgba(59, 130, 246, 0.25);
        border-radius: 4px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        padding: 6px 12px;
        color: #ffffff;
        background: #2563eb;
        border: 1px solid #3b82f6;
        border-radius: 6px;
        transition: background-color 0.15s ease;
      }
      .btn:hover { background: #1d4ed8; }
      .viewer-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0d1117;
      }
      .video-shell { width: min(100%, 1200px); }
      video {
        display: block;
        width: 100%;
        max-height: calc(100vh - 96px);
        aspect-ratio: 16 / 9;
        background: #000000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
      }
      .fallback { margin-top: 12px; text-align: center; color: #94a3b8; font-size: 14px; line-height: 1.5; }
      .fallback a { color: #60a5fa; }
      @media (max-width: 480px) {
        .header { padding: 0 12px; }
        .brand-title { display: none; }
        .btn { font-size: 12px; padding: 5px 10px; }
        .viewer-wrapper { padding: 16px 12px; }
        video { max-height: calc(100vh - 80px); border-radius: 6px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/" class="brand" title="Baleena Home">
          <img src="/baleena-logo.png" alt="Baleena Logo" />
          <span class="brand-title">Baleena</span>
          <span class="badge">Demo</span>
        </a>
        <a href="/Baleena-Demo.mp4" target="_blank" rel="noopener noreferrer" class="btn">Open Video</a>
      </header>
      <main class="viewer-wrapper" aria-label="Baleena product demo">
        <div class="video-shell">
          <video controls playsinline preload="metadata" aria-label="Baleena product demo video">
            <source src="/Baleena-Demo.mp4" type="video/mp4" />
            Your browser cannot play this video. <a href="/Baleena-Demo.mp4">Open the Baleena product demo video.</a>
          </video>
          <p class="fallback" id="video-fallback" hidden>
            This video could not be played. <a href="/Baleena-Demo.mp4">Try opening it directly</a>.
          </p>
        </div>
      </main>
    </div>
    <script>
      const video = document.querySelector('video')
      const fallback = document.querySelector('#video-fallback')

      video.addEventListener('error', () => {
        fallback.hidden = false
      }, true)
    </script>
    <script src="/special-page-history.js"></script>
  </body>
</html>
